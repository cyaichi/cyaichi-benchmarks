# Baseline foundation. Always merged with a scenario compose file via
# scripts/cyaichi-session. Tenant service ports bind 127.0.0.1 only.

services:
  firewall:
    build:
      context: ${SESSION_DIR}/infra/baseline/firewall
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      net.ipv4.ip_forward: "1"
    networks:
      net-asset:
        ipv4_address: 172.30.10.2
      net-attacker:
        ipv4_address: 172.30.20.2
      net-soc:
        ipv4_address: 172.30.30.2
      net-test:
        ipv4_address: 172.30.40.2
      net-egress:
        ipv4_address: 172.30.50.2
    volumes:
      - ${SESSION_DIR}/data/firewall:/var/log/cyaichi
    restart: unless-stopped

  proxy:
    build:
      context: ${SESSION_DIR}/infra/baseline/proxy
    networks:
      net-asset:
        ipv4_address: 172.30.10.3
      net-attacker:
        ipv4_address: 172.30.20.3
      net-soc:
        ipv4_address: 172.30.30.3
      net-egress:
        ipv4_address: 172.30.50.3
    volumes:
      - ${SESSION_DIR}/data/proxy/squid.conf:/etc/squid/squid.conf:ro
      - ${SESSION_DIR}/data/proxy/logs:/var/log/squid
    depends_on:
      - firewall
    restart: unless-stopped

  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/etc/coredns/Corefile"]
    networks:
      net-asset:
        ipv4_address: 172.30.10.4
      net-attacker:
        ipv4_address: 172.30.20.4
      net-soc:
        ipv4_address: 172.30.30.4
      net-egress:
        ipv4_address: 172.30.50.4
    volumes:
      - ${SESSION_DIR}/data/dns/Corefile:/etc/coredns/Corefile:ro
      - ${SESSION_DIR}/data/dns/hosts:/etc/coredns/hosts:ro
    depends_on:
      - firewall
    restart: unless-stopped

  ntp:
    build:
      context: ${SESSION_DIR}/infra/baseline/ntp
    networks:
      net-egress:
        ipv4_address: 172.30.50.5
    depends_on:
      - firewall
    restart: unless-stopped

  soc-host:
    build:
      context: ${SESSION_DIR}/infra/baseline/hosts
      dockerfile: soc/Dockerfile
    hostname: soc-host
    cap_add:
      - NET_ADMIN
    dns:
      - 172.30.30.4
    environment:
      HTTP_PROXY: http://172.30.30.3:3128
      HTTPS_PROXY: http://172.30.30.3:3128
      NO_PROXY: localhost,127.0.0.1,::1,172.30.0.0/16,lab,.lab,soc-host,attacker-host
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    shm_size: 512mb
    networks:
      net-soc:
        ipv4_address: 172.30.30.10
      net-bind: {}
    ports:
      - "127.0.0.1:8443:443"
      - "127.0.0.1:55000:55000"
      - "127.0.0.1:9200:9200"
    volumes:
      - ${SESSION_DIR}/data/soc/meta:/var/lib/cyaichi
      - ${SESSION_DIR}/data/soc/indexer:/var/lib/wazuh-indexer
      - ${SESSION_DIR}/data/soc/filebeat:/var/lib/filebeat
      - ${SESSION_DIR}/data/soc/ossec/queue:/var/ossec/queue
      - ${SESSION_DIR}/data/soc/ossec/logs:/var/ossec/logs
      - ${SESSION_DIR}/data/soc/ossec/api-configuration:/var/ossec/api/configuration
      - ${SESSION_DIR}/data/soc/ossec/client.keys:/var/ossec/etc/client.keys
    depends_on:
      - firewall
      - dns
      - proxy
    restart: unless-stopped

  attacker-host:
    build:
      context: ${SESSION_DIR}/infra/baseline/hosts
      dockerfile: attacker/Dockerfile
    hostname: attacker-host
    cap_add:
      - NET_ADMIN
    dns:
      - 172.30.20.4
    environment:
      HTTP_PROXY: http://172.30.20.3:3128
      HTTPS_PROXY: http://172.30.20.3:3128
      NO_PROXY: 172.30.0.0/16,lab,.lab,dvwa-host,soc-host
    networks:
      net-attacker:
        ipv4_address: 172.30.20.10
      net-bind: {}
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ${SESSION_DIR}/data/attacker:/var/lib/cyaichi
    depends_on:
      - firewall
      - dns
    restart: unless-stopped

networks:
  net-asset:
    internal: true
    ipam:
      config:
        - subnet: 172.30.10.0/24
  net-attacker:
    internal: true
    ipam:
      config:
        - subnet: 172.30.20.0/24
  net-soc:
    internal: true
    ipam:
      config:
        - subnet: 172.30.30.0/24
  net-test:
    ipam:
      config:
        - subnet: 172.30.40.0/24
  net-egress:
    ipam:
      config:
        - subnet: 172.30.50.0/24
  # Not a tenant. Docker cannot publish host ports from `internal` networks;
  # this bridge exists so 127.0.0.1 binds on soc-host and attacker-host work.
  net-bind: {}
