http_port 3128

acl localnet src 172.30.10.0/24
acl localnet src 172.30.20.0/24
acl localnet src 172.30.30.0/24

acl Safe_ports port 80
acl Safe_ports port 443
acl Safe_ports port 3128
acl SSL_ports port 443

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Fail closed. Scenarios add src/dst allowlists when a host has a
# legitimate outbound need. The attacker never gets the real internet.
http_access deny all

access_log /var/log/squid/access.log squid
cache deny all
